# fundXI — Model A pricing coefficients.
#
# This file is the model's calibration. Edit a value here and restart
# the valuation worker to re-tune — no code change, no redeploy.
# Tracked in git so the calibration history is visible.
#
# Every ``w_*_pct`` is a percent delta applied to the player's
# pre-event price. See context/FUNDXI-VALUATION-MODEL.md for the model.
#
# Loader rules (src/valuation/coefficients.py):
#   - a missing key keeps the code default for that field;
#   - an unknown key is a loud error (catches typos);
#   - a missing file falls back entirely to code defaults.

# === Positive signals ===
w_goal_pct = 5.0
w_assist_pct = 3.0
w_penalty_scored_pct = 5.0      # same boost as a regular goal
w_penalty_missed_pct = -4.0
w_own_goal_pct = -6.0

# === Discipline ===
w_yellow_card_pct = -1.0
w_red_card_pct = -8.0
w_yellow_red_card_pct = -8.0

# === Participation ===
w_starter_clean_pct = 0.5       # starter who finished with no negative event

# === Per-match bounds (clamp the total delta of one fixture) ===
max_delta_pct_per_match = 25.0
min_delta_pct_per_match = -15.0

# === Layer 2: continuous performance (per-poll stat diff) ===
w_xg_per_0_1_pct = 0.45         # per +0.10 xG since last poll
w_xa_per_0_1_pct = 0.30         # per +0.10 xA since last poll
w_shot_on_target_pct = 0.20
w_shot_off_target_pct = 0.06
w_key_pass_pct = 0.12
max_delta_pct_per_poll = 2.0
min_delta_pct_per_poll = -2.0

# === Model A: rating-driven live multiplier ===
rating_baseline = 6.0
k_rating = 0.04                 # +4% of price per rating point above baseline
live_floor_frac = -0.30         # one match can't pull a player below -30%
live_ceil_frac = 0.40           # ...nor above +40%
multiplier_floor = 0.05         # price stays strictly positive

# === Layer 3: Pressure Index modulator ===
pressure_mod_min = 0.7
pressure_mod_max = 1.3

# === Layer 4: team propagation (team goal for / against) ===
w_team_goal_for_pct = 0.5
w_team_goal_against_pct = 0.5   # magnitude; applied negative
pos_mult_for_gk = 0.4
pos_mult_for_def = 0.7
pos_mult_for_mid = 1.0
pos_mult_for_fwd = 1.3
pos_mult_against_gk = 1.6
pos_mult_against_def = 1.3
pos_mult_against_mid = 1.0
pos_mult_against_fwd = 0.7

# === Layer 5: playing time / bench ===
w_out_of_xi_pct = -2.0
w_subbed_off_pct = -0.4
w_subbed_on_pct = 0.8
w_unused_sub_pct = -1.0
