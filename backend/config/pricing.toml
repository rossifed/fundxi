# fundXI — Model A pricing coefficients.
#
# This file is the model's calibration. Edit a value here and restart
# the valuation worker to re-tune — no code change, no redeploy.
# Tracked in git so the calibration history is visible.
#
# Units by section:
#   - *_pct  (Layer 2)  : PERCENT per-poll stat deltas (0.20 == +0.20%).
#   - *_frac (Model A + tournament events) : FRACTIONS (-0.40 == -40%).
# See context/FUNDXI-VALUATION-MODEL.md for the model.
#
# Loader rules (src/valuation/coefficients.py):
#   - a missing key keeps the code default for that field;
#   - an unknown key is a loud error (catches typos);
#   - a missing file falls back entirely to code defaults.

# === Layer 2: continuous performance (per-poll stat diff) ===
w_xg_per_0_1_pct = 0.45         # per +0.10 xG since last poll
w_xa_per_0_1_pct = 0.30         # per +0.10 xA since last poll
w_shot_on_target_pct = 0.20
w_shot_off_target_pct = 0.06
w_key_pass_pct = 0.12
max_delta_pct_per_poll = 2.0
min_delta_pct_per_poll = -2.0

# === Model A: rating-driven live multiplier ===
rating_baseline = 6.0
k_rating = 0.04                 # +4% of price per rating point above baseline
live_floor_frac = -0.30         # one match can't pull a player below -30% (pre-volatility core clamp)
live_ceil_frac = 0.40           # ...nor above +40% (pre-volatility core clamp)
multiplier_floor = 0.05         # price stays strictly positive
vol_base_floor = 10.0           # volatility uses max(base, this): caps micro-cap explosion (spec §4.2 floor)
live_abs_cap_frac = 0.30        # hard +/-30% bound on the final live move (post-volatility), any base

# === Tournament events (persistent; multiplicative on current price, NOT vol-scaled) ===
# A result is a collective fate hitting the whole squad equally.
w_group_win_frac = 0.02              # group-stage win
w_knockout_win_frac = 0.05           # knockout win (team advances)
w_knockout_elimination_frac = -0.40  # knockout loss — the brutal drop
w_qualification_frac = 0.05          # group qualification (standings-driven)
w_suspension_frac = -0.15            # banned next match (red / 2-yellow accumulation)
w_out_of_xi_frac = -0.02             # dropped from the XI (started last match, benched this one)
w_did_not_play_frac = -0.01          # per zero-minute match, scaled by tally: -1% x N (benchwarmer rot)

# === Layer 3: Pressure Index modulator ===
pressure_mod_min = 0.7
pressure_mod_max = 1.3
